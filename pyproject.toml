[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lltp"
version = "0.1.0"
description = "Lunar Lander frame prediction with a convolutional autoencoder and recurrent dynamics in latent space."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "See repository contributors" }]
keywords = ["reinforcement-learning", "lunar-lander", "pytorch", "autoencoder", "rnn"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24.0,<3",
  "torch>=2.0.0",
  "matplotlib>=3.7.0",
  "Pillow>=10.0.0",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
gym = [
  "gymnasium[box2d]>=0.29.0",
  "opencv-python-headless>=4.8.0",
]
dev = [
  "pytest>=7.4.0",
]
notebook = [
  "torchvision>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
